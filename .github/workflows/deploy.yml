name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/star-display-project-plan-fncsgu]
  workflow_dispatch:

# GITHUB_TOKEN 권한: Pages 배포에 필요한 최소 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 (진행 중 배포는 유지, 대기 중 중복은 취소)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Pages가 아직 켜져 있지 않으면 자동으로 활성화
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 정적 사이트 전체(루트)를 업로드
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
